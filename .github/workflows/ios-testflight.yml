# Builds the iOS app via EAS Build (production profile) and submits it to
# TestFlight via EAS Submit on every push to main. PRs are handled by ci.yml.
#
# If only the submit step fails, do NOT re-run this workflow (that rebuilds
# and spends another EAS build). Run ios-submit.yml instead to submit the
# already-finished build.
#
# Required GitHub secret:
#   EXPO_TOKEN  — expo.dev → Account Settings → Access Tokens
#
# Submission credentials: the App Store Connect API key is stored on EAS
# servers (set up once with `eas credentials -p ios`, or saved during a first
# interactive `eas submit`). EAS Submit uses it automatically in CI, so no ASC
# secrets or key files are needed here. eas.json only carries the public
# `ascAppId` (required for non-interactive submit).
#
# One-time local prerequisites (run before first CI push):
#   cd mobile && eas credentials   # EAS-managed iOS dist cert + profile
#   cd mobile && eas credentials   # + App Store Connect API key for submission
#   Create the app record on App Store Connect if it doesn't exist yet.
name: iOS TestFlight

on:
  push:
    branches: [main]

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint:deps
      - run: npm run typecheck
      - run: npm test

  build-and-submit:
    name: Build & submit to TestFlight
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        id: build
        working-directory: mobile
        run: |
          build_json=$(eas build --platform ios --profile production --non-interactive --json)
          echo "build-id=$(echo "$build_json" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"
      - name: Submit to TestFlight
        working-directory: mobile
        run: eas submit --platform ios --profile production --non-interactive --id "$BUILD_ID"
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
